<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
</head>
<body>
    <style>
        body {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .fail {
            background-color: tomato;
        }

        pre {
            border-radius: 10px;
            padding: 20px;
            font-size: 14px;
            overflow-x: auto;
            background-color: lightgray;
        }

        code {
            font-family: 'Fira Code', monospace;
        }

        .success {
            background-color: lightgreen;
        }

        .test {
            padding: 10px;
            border-radius: 10px;
        }

        .test h2 {
            margin: 5px 0px;
        }

        .test p {
            margin: 5px 0px;
        }
    </style>
    <h3></h3>

    <script src="test.js"></script>
</body>
</html>
